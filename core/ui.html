
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #1f3c88;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #162d63;
    }

    .status {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>DMX MASTER - Registro Venta</h2>

  <input type="text" id="vendedor" placeholder="Nombre del vendedor">
  <input type="text" id="idCte" placeholder="ID Cliente">
  <input type="text" id="nombre" placeholder="Nombre Cliente">
  <input type="text" id="telefono" placeholder="Teléfono">
  <input type="text" id="producto" placeholder="Producto">
  <input type="number" id="cantidad" placeholder="Cantidad">
  <input type="number" id="precio" placeholder="Precio Unitario">
  
  <select id="envio">
    <option value="Local">Local</option>
    <option value="Foráneo">Foráneo</option>
  </select>

  <button onclick="enviar()">Registrar Venta</button>

  <div class="status" id="status"></div>
</div>

<script>
function enviar() {

  const payload = {
    vendedor: document.getElementById("vendedor").value,
    idCte: document.getElementById("idCte").value,
    nombre: document.getElementById("nombre").value,
    telefono: document.getElementById("telefono").value,
    producto: document.getElementById("producto").value,
    cantidad: parseFloat(document.getElementById("cantidad").value),
    precio: parseFloat(document.getElementById("precio").value),
    envio: document.getElementById("envio").value
  };

  document.getElementById("status").innerText = "Enviando...";

  google.script.run
    .withSuccessHandler(function(response) {
      const res = JSON.parse(response);
      document.getElementById("status").innerText = res.message;
    })
    .withFailureHandler(function(error) {
      document.getElementById("status").innerText = "Error en envío";
    })
    .doPost({ postData: { contents: JSON.stringify(payload) } });
}
</script>

</body>
</html>
